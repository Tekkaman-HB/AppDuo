bundle_id: com.tencent.workbuddy.mac
app_name: WorkBuddy
strategy: hard_clone
app_type: electron
strip_sandbox: true
launch_args:
- --user-data-dir={{ATB_DATA_DIR}}/UserData
# WorkBuddy stores auth outside its config/userData dirs, under os.homedir().
# Isolate HOME too, but share only the OS keychain directory so Security can
# locate the existing default keychain. Do not link Application Support/auth.
environment_injection:
  HOME: '{{ATB_DATA_DIR}}/Home'
  TMPDIR: '{{ATB_DATA_DIR}}/Tmp'
  WORKBUDDY_CONFIG_DIR: '{{ATB_DATA_DIR}}/Config'
  CODEBUDDY_CONFIG_DIR: '{{ATB_DATA_DIR}}/Config'
  WORKBUDDY_USER_DATA_DIR: '{{ATB_DATA_DIR}}/UserData'
symlink_whitelist:
- Library/Keychains
